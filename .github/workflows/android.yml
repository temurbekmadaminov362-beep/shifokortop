# Builds the Shifokor top Android app (APK) and puts it on the site at download/shifokortop.apk.
# The app shows the live site, so ordinary site changes do not need a new APK.
# Optional: repository secrets KEYSTORE_B64 (base64 of a .jks with alias "shifokortop") and KEYSTORE_PASS
# keep the same signature across builds; without them each build gets a fresh key.
name: Android ilova (APK)

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and sign the APK
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          PLAT=$(ls -d "$ANDROID_HOME"/platforms/android-*/ | grep -E 'android-[0-9]+/$' | sort -V | tail -1)
          JAR="${PLAT}android.jar"
          echo "build-tools: $BT"; echo "platform: $PLAT"
          cd android
          rm -rf build && mkdir -p build/classes build/dex
          "${BT}aapt2" compile --dir res -o build/res.zip
          "${BT}aapt2" link -o build/base.apk -I "$JAR" --manifest AndroidManifest.xml \
            --min-sdk-version 24 --target-sdk-version 34 \
            --version-code "${{ github.run_number }}" --version-name "1.${{ github.run_number }}" \
            build/res.zip
          javac -encoding UTF-8 -source 8 -target 8 -Xlint:-options -nowarn \
            -bootclasspath "$JAR" -classpath "$JAR" -d build/classes $(find src -name '*.java')
          "${BT}d8" --release --min-api 24 --lib "$JAR" --output build/dex $(find build/classes -name '*.class')
          (cd build/dex && zip -q ../base.apk classes.dex)
          "${BT}zipalign" -p -f 4 build/base.apk build/aligned.apk
          if [ -n "${KEYSTORE_B64:-}" ]; then
            echo "$KEYSTORE_B64" | base64 -d > build/ks.jks
            PASS="$KEYSTORE_PASS"
          else
            PASS=$(openssl rand -hex 16)
            keytool -genkeypair -keystore build/ks.jks -storepass "$PASS" -keypass "$PASS" -alias shifokortop \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Shifokor top, O=Shifokor top, C=UZ"
          fi
          "${BT}apksigner" sign --ks build/ks.jks --ks-pass "pass:$PASS" --ks-key-alias shifokortop \
            --out build/shifokortop.apk build/aligned.apk
          "${BT}apksigner" verify --verbose build/shifokortop.apk
          "${BT}aapt2" dump badging build/shifokortop.apk | head -5
          mkdir -p ../download
          cp build/shifokortop.apk ../download/shifokortop.apk
          rm -f build/ks.jks

      - uses: actions/upload-artifact@v4
        with:
          name: shifokortop-apk
          path: download/shifokortop.apk

      - name: Put the APK on the site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add download/shifokortop.apk
          git commit -m "Android ilova: APK ${{ github.run_number }}" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
